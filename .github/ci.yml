name: CI Todo-List

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Build with Gradle
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build
          fi
