##
## MySQL JDBC Configuration
##
jdbc.default.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.default.url=jdbc:mysql://mysql-db:3306/lportal?characterEncoding=UTF-8&dontTrackOpenResources=true&holdResultsOpenOverStatementClose=true&serverTimezone=UTC&useFastDateParsing=false&useUnicode=true
jdbc.default.username=todolist
jdbc.default.password=todolistsea

##
## User Registration
##
# Permite que qualquer pessoa se cadastre (não só usuários convidados)
company.security.strangers=true
# Não exige verificação de e-mail para ativar a conta
company.security.strangers.verify=false
# Permite qualquer domínio de e-mail no cadastro
company.security.strangers.with.mx=true

##
## Mail (desabilitado para ambiente de desenvolvimento sem servidor SMTP)
##
mail.session.mail=false

##
## Password Policy
##
# NÃ£o obriga troca de senha no primeiro login para novos cadastros
passwords.default.policy.change.required=false

##
## Login Redirect
##
# Sempre direciona o login bem-sucedido para a home do portal.
auth.forward.by.last.path=false
default.landing.page.path=/web/guest/home
