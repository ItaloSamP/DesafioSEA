version: "3.8"

services:
  liferay:
    image: liferay/portal:7.4.3.112-ga112
    container_name: todolist-liferay
    ports:
      - "8080:8080"
      - "11311:11311"
    environment:
      - LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ADD_PERIOD_SAMPLE_PERIOD_DATA=on
      - LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED=false
      # Apontando o Liferay para o container do banco de dados
      - LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASE_CLASS_UPPERCASE_NAME=com.mysql.cj.jdbc.Driver
      - LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL=jdbc:mysql://mysql-db:3306/lportal?characterEncoding=UTF-8&dontTrackOpenResources=true&holdResultsOpenOverStatementClose=true&serverTimezone=GMT&useFastDateParsing=false&useUnicode=true
      - LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_USERNAME=${DB_USER}
      - LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_PASSWORD=${DB_PASS}
      # Ajuste de memória para o Liferay não travar (2GB de RAM)
      - LIFERAY_JAVA_OPTS=-Xms2g -Xmx2g -Dfile.encoding=UTF8 -Duser.timezone=GMT-3
    volumes:
      - ./bundles:/opt/liferay/data
      - ./deploy:/opt/liferay/deploy
    depends_on:
      - mysql-db
    networks:
      - liferay-network

  mysql-db:
    image: mysql:8.0
    container_name: mysql-todolist
    environment:
      - MYSQL_DATABASE=lportal
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - liferay-network

networks:
  liferay-network:
    driver: bridge

volumes:
  mysql-data:
