services:
  liferay:
    image: liferay/portal:7.4.3.112-ga112
    container_name: todolist-liferay
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "11311:11311"
    environment:
      - LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ADD_PERIOD_SAMPLE_PERIOD_DATA=off
      - LIFERAY_SETUP_PERIOD_WIZARD_PERIOD_ENABLED=false
      - LIFERAY_PASSWORDS_PERIOD_DEFAULT_PERIOD_POLICY_PERIOD_CHANGE_PERIOD_REQUIRED=false
      # A configuracao JDBC ja esta centralizada em bundles/portal-ext.properties.
      - LIFERAY_JAVA_OPTS=-Xms2g -Xmx2g -Dfile.encoding=UTF8 -Duser.timezone=GMT-3
    volumes:
      - ./bundles:/opt/liferay/data
      - ./bundles/portal-ext.properties:/opt/liferay/portal-ext.properties
      - ./deploy:/opt/liferay/deploy
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:8080/c/portal/layout\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 15m
    networks:
      - liferay-network

  mysql-db:
    image: mysql:8.0
    container_name: mysql-todolist
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=lportal
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - liferay-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  liferay-network:
    driver: bridge

volumes:
  mysql-data:
